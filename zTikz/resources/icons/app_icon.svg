<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient (Sky Blue to Cornflower Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEFA" />
      <stop offset="100%" stop-color="#6495ED" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" />

  <!-- "zT" Text -->
  <text x="128" y="165" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="110" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#shadow)">zT</text>
</svg>
